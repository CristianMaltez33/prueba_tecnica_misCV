version: '3.8'

services:
  app:
    build: .
    container_name: laravel_app
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "9000:9000"
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - laravel_network

  mongo:
    image: mongo:7.0
    container_name: laravel_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - laravel_network

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/app
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - laravel_network

volumes:
  mongo_data:
  mongo_config:

networks:
  laravel_network:
    driver: bridge